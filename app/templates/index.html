<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Transcrever Reel do Instagram</h1>
      <p>Cole o link de um Reel público. O servidor faz o resto.</p>

      <form id="transcribe-form">
        <label for="url">Link do Reel</label>
        <input id="url" name="url" type="url" placeholder="https://www.instagram.com/reel/..." required />

        <label for="language">Idioma</label>
        <select id="language" name="language">
          <option value="pt" selected>Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="auto">Auto</option>
        </select>

        <button type="submit">Transcrever</button>
      </form>

      <div id="status" class="status"></div>
      <textarea id="result" rows="14" placeholder="A transcrição vai aparecer aqui." readonly></textarea>
    </section>
  </main>

  <script>
    const form = document.getElementById('transcribe-form');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.textContent = 'Processando...';
      resultEl.value = '';

      const data = new FormData(form);
      if (data.get('language') === 'auto') {
        data.set('language', '');
      }

      try {
        const response = await fetch('/api/transcribe', {
          method: 'POST',
          body: data,
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Falha ao transcrever.');
        }

        resultEl.value = payload.text || '';
        statusEl.textContent = 'Concluído.';
      } catch (error) {
        statusEl.textContent = error.message || 'Erro inesperado.';
      }
    });
  </script>
</body>
</html>
